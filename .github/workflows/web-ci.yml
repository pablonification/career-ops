name: Web CI

# CI for the experimental web UI (web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'web/**'
  push:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx oxlint --config ./oxlint.config.ts src/server/db src/server/auth src/server/billing src/server/scoring src/server/gmail src/lib/nav-items.ts src/lib/auth-client.ts src/app/api/billing src/app/api/explore/scored src/app/api/tracker src/app/api/gmail src/components/theme-toggle.tsx src/components/auth src/components/explore/score-badge.tsx src/components/explore/scored-table.tsx src/components/jobs/job-detail-tabs.tsx src/components/tracker src/app/\(auth\) src/app/explore/page.tsx src/app/jobs/\[id\]/page.tsx src/app/tracker/page.tsx --deny-warnings
      - run: npm run build
