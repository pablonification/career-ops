services:
  postgres:
    image: postgres:16-alpine
    container_name: career-ops-pg
    environment:
      POSTGRES_DB: careerops
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d careerops"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: career-ops-web:local
    container_name: career-ops-web
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--port", "3000", "--hostname", "0.0.0.0"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./web/.env.local
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://app:app@postgres:5432/careerops
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - /app/.next
    restart: unless-stopped

  career-ops:
    build:
      context: .
      dockerfile: Dockerfile
    image: career-ops:local
    container_name: career-ops
    working_dir: /app
    # Long-running shell so `docker compose exec` is instant.
    command: ["tail", "-f", "/dev/null"]
    init: true
    # Mount whole project so edits on host are visible inside the container.
    # node_modules is kept inside the image to avoid host/container ABI mismatch
    # (host is ubuntu26.04 where playwright won't install; image is jammy).
    volumes:
      - .:/app
      - career-ops-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      # Forward common API keys if set on host. Empty values are ignored.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    # Chromium needs a larger /dev/shm than the default 64M.
    shm_size: "1gb"
    # Dashboard TUI is interactive; expose nothing by default but allow `-it`.
    tty: true
    stdin_open: true
    restart: unless-stopped

volumes:
  pgdata:
  web-node-modules:
  career-ops-node-modules:
